<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <form 
    action="https://n8n.visaloka.com/webhook/35928f50-0041-4dd5-8429-b961a62bfb02"

    </div>

    <!-- Submit -->
    <button 
      type="submit"
      class="w-full bg-blue-600 text-white py-3 rounded-xl font-medium hover:bg-blue-700 transition"
    >
      Submit Application
    </button>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');

    dropzone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.classList.remove('hidden');
      }
    });

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('border-blue-500');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('border-blue-500');
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('border-blue-500');

      const file = e.dataTransfer.files[0];
      fileInput.files = e.dataTransfer.files;

      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.classList.remove('hidden');
      }
    });


    const form = document.querySelector('form');
const submitBtn = form.querySelector('button');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const originalText = submitBtn.innerText;
  submitBtn.disabled = true;
  submitBtn.classList.replace('bg-blue-600', 'bg-gray-400');

  let timeLeft = 40;
  submitBtn.innerText = `Generating Files... ${timeLeft}s`;
  
  const countdownInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft > 0) {
      submitBtn.innerText = `Generating Files... ${timeLeft}s`;
    } else {
      timeLeft = 35; // Reset countdown if fetch hasn't finished yet
      submitBtn.innerText = `Generating Files... ${timeLeft}s`;
    }
  }, 1000);

  const formData = new FormData(form);

  try {
    const response = await fetch(form.action, {
      method: 'POST',
      body: formData
    });

    if (!response.ok) throw new Error('Gagal memproses visa');

    const blob = await response.blob();
    
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Visa_Application.zip`;
    document.body.appendChild(a);
    a.click();

    window.URL.revokeObjectURL(url);
    alert('Success! Your visa documents have been generated.');

  } catch (error) {
    console.error(error);
    alert('Error: ' + error.message);
  } finally {
    clearInterval(countdownInterval);
    submitBtn.innerText = originalText;
    submitBtn.disabled = false;
    submitBtn.classList.replace('bg-gray-400', 'bg-blue-600');
  }
});
  </script>
